<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Empathy Map</title><defs><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker></defs><rect x="0" y="0" width="760" height="440" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Empathy Map</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Classic Rummy · a first-time player</text><rect x="28" y="80" width="348" height="162" rx="14" fill="#e9ebf6" stroke="#3d4b8f" stroke-width="1.4"/><text x="46" y="110" font-size="14" font-weight="800" fill="#3d4b8f" text-anchor="start">SAYS</text><text x="46" y="144.0" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">“I don’t know if I’m playing</text><text x="46" y="162.48" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">correctly.”</text><rect x="384" y="80" width="348" height="162" rx="14" fill="#fff4c2" stroke="#9a4b2b" stroke-width="1.4"/><text x="454" y="110" font-size="14" font-weight="800" fill="#9a4b2b" text-anchor="start">THINKS</text><text x="454" y="144.0" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">“Will I lose money because I</text><text x="454" y="162.48" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">don’t understand the rules?”</text><rect x="28" y="250" width="348" height="162" rx="14" fill="#e5f2ea" stroke="#2f7a55" stroke-width="1.4"/><text x="46" y="280" font-size="14" font-weight="800" fill="#2f7a55" text-anchor="start">DOES</text><text x="46" y="314.0" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">Watches others play, avoids</text><text x="46" y="332.48" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">cash tables, opens Help</text><rect x="384" y="250" width="348" height="162" rx="14" fill="#fbe7ef" stroke="#a3365f" stroke-width="1.4"/><text x="454" y="280" font-size="14" font-weight="800" fill="#a3365f" text-anchor="start">FEELS</text><text x="454" y="314.0" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">Curious but nervous; worried</text><text x="454" y="332.48" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">about mistakes</text><circle cx="380" cy="250" r="46" fill="#ffffff" stroke="#1c2541" stroke-width="2"/><circle cx="380" cy="238" r="13" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><path d="M 358 274 Q 380 248 402 274" stroke="#1c2541" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="338" y="300" width="84" height="22" rx="11" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="380" y="315" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">New player</text></svg>