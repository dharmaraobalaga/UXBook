<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Persona</title><defs><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker></defs><rect x="0" y="0" width="760" height="420" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Persona</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Classic Rummy · Ravi, beginner player (illustrative)</text><rect x="28" y="84" width="704" height="310" rx="16" fill="#ffffff" stroke="#d4ccb8" stroke-width="1.2"/><rect x="28" y="84" width="220" height="310" rx="16" fill="#e9ebf6" stroke="#e9ebf6" stroke-width="1.2"/><rect x="232" y="84" width="16" height="310" rx="0" fill="#e9ebf6" stroke="#e9ebf6" stroke-width="1.2"/><circle cx="138" cy="160" r="48" fill="#ffffff" stroke="#3d4b8f" stroke-width="2"/><circle cx="138" cy="146" r="17" fill="#3d4b8f" stroke="#3d4b8f" stroke-width="1.2"/><path d="M 108 194 Q 138 160 168 194" stroke="#3d4b8f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="238" font-size="20" font-weight="800" fill="#1c2541" text-anchor="middle">Ravi</text><text x="138" y="260" font-size="12.5" font-weight="600" fill="#3d4b8f" text-anchor="middle">Beginner player</text><text x="138" y="296.0" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="middle">28 · works in sales ·</text><text x="138" y="311.84" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="middle">plays in short breaks</text><rect x="52" y="340" width="172" height="36" rx="18" fill="#ffffff" stroke="#c9d0ea" stroke-width="1.2"/><text x="138.0" y="354.55" font-size="11.5" font-weight="600" fill="#3d4b8f" text-anchor="middle">“I just want to learn</text><text x="138.0" y="368.925" font-size="11.5" font-weight="600" fill="#3d4b8f" text-anchor="middle">fast.”</text><rect x="268" y="104" width="3" height="110" rx="1" fill="#2f7a55" stroke="#2f7a55" stroke-width="1.2"/><text x="282" y="122" font-size="11.5" font-weight="800" fill="#2f7a55" text-anchor="start">GOALS</text><text x="282" y="148.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Learn the game quickly,</text><text x="282" y="166.48" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">play for fun</text><rect x="500" y="104" width="3" height="110" rx="1" fill="#3d4b8f" stroke="#3d4b8f" stroke-width="1.2"/><text x="514" y="122" font-size="11.5" font-weight="800" fill="#3d4b8f" text-anchor="start">NEEDS</text><text x="514" y="148.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Simple rules, low-risk</text><text x="514" y="166.48" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">practice</text><rect x="268" y="244" width="3" height="110" rx="1" fill="#1f6f78" stroke="#1f6f78" stroke-width="1.2"/><text x="282" y="262" font-size="11.5" font-weight="800" fill="#1f6f78" text-anchor="start">BEHAVIOURS</text><text x="282" y="288.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Plays on mobile in</text><text x="282" y="306.48" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">10-minute sessions</text><rect x="500" y="244" width="3" height="110" rx="1" fill="#9a4b2b" stroke="#9a4b2b" stroke-width="1.2"/><text x="514" y="262" font-size="11.5" font-weight="800" fill="#9a4b2b" text-anchor="start">CHALLENGES</text><text x="514" y="288.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Confused by card</text><text x="514" y="306.48" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">grouping; worried about</text><text x="514" y="324.96" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">losing money</text></svg>