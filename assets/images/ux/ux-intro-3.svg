<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>What is a UX deliverable?</title><defs><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker></defs><rect x="0" y="0" width="760" height="300" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">What is a UX deliverable?</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Four words that are often mixed up</text><rect x="28" y="88" width="164" height="170" rx="14" fill="#e9ebf6" stroke="#3d4b8f" stroke-width="1.4"/><text x="110" y="122" font-size="15" font-weight="700" fill="#3d4b8f" text-anchor="middle">UX Process</text><text x="110" y="154.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">The activities we</text><text x="110" y="171.16" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">do</text><text x="110" y="210.0" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">e.g. Research →</text><text x="110" y="225.18" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">Design → Test</text><line x1="192" y1="173" x2="208" y2="173" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="208" y="88" width="164" height="170" rx="14" fill="#fff4c2" stroke="#9a4b2b" stroke-width="1.4"/><text x="290" y="122" font-size="15" font-weight="700" fill="#9a4b2b" text-anchor="middle">UX Method</text><text x="290" y="154.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">How we do an</text><text x="290" y="171.16" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">activity</text><text x="290" y="210.0" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">e.g. User interviews,</text><text x="290" y="225.18" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">card sorting</text><line x1="372" y1="173" x2="388" y2="173" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="388" y="88" width="164" height="170" rx="14" fill="#e5f2ea" stroke="#2f7a55" stroke-width="1.4"/><text x="470" y="122" font-size="15" font-weight="700" fill="#2f7a55" text-anchor="middle">UX Deliverable</text><text x="470" y="154.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">The outcome we</text><text x="470" y="171.16" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">produce</text><text x="470" y="210.0" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">e.g. Persona, Journey</text><text x="470" y="225.18" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">map</text><line x1="552" y1="173" x2="568" y2="173" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="568" y="88" width="164" height="170" rx="14" fill="#e2f2f3" stroke="#1f6f78" stroke-width="1.4"/><text x="650" y="122" font-size="15" font-weight="700" fill="#1f6f78" text-anchor="middle">UX Artifact</text><text x="650" y="154.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">The form or work</text><text x="650" y="171.16" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">product</text><text x="650" y="210.0" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">e.g. Figma file, PDF,</text><text x="650" y="225.18" font-size="11.5" font-weight="500" fill="#4a4f57" text-anchor="middle">poster</text></svg>