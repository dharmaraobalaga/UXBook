<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>End-to-end UX design lifecycle</title><defs><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker></defs><rect x="0" y="0" width="760" height="560" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">End-to-end UX design lifecycle</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Learning framework · phases overlap and repeat in real Agile teams</text><ellipse cx="380" cy="312" rx="262" ry="196" fill="none" stroke="#c9d0ea" stroke-width="2" stroke-dasharray="6 6"/><rect x="288.0" y="83.0" width="184" height="66" rx="12" fill="#e9ebf6" stroke="#d4ccb8" stroke-width="1.2"/><text x="380.0" y="111.2375" font-size="12.5" font-weight="700" fill="#1c2541" text-anchor="middle">1 Discovery &amp; Research</text><text x="380.0" y="130.8625" font-size="10.5" font-weight="500" fill="#4a4f57" text-anchor="middle">Interviews · CSD · Empathy</text><rect x="473.26197667087547" y="140.4070708874367" width="184" height="66" rx="12" fill="#e9ebf6" stroke="#d4ccb8" stroke-width="1.2"/><text x="565.2619766708755" y="168.6445708874367" font-size="12.5" font-weight="700" fill="#1c2541" text-anchor="middle">2 Define &amp; Synthesize</text><text x="565.2619766708755" y="188.2695708874367" font-size="10.5" font-weight="500" fill="#4a4f57" text-anchor="middle">Affinity · Persona · Journey</text><rect x="550.0" y="279.0" width="184" height="66" rx="12" fill="#fff4c2" stroke="#d4ccb8" stroke-width="1.2"/><text x="642.0" y="307.2375" font-size="12.5" font-weight="700" fill="#1c2541" text-anchor="middle">3 Ideation &amp; Strategy</text><text x="642.0" y="326.8625" font-size="10.5" font-weight="500" fill="#4a4f57" text-anchor="middle">Mind map · Kano · RICE</text><rect x="473.26197667087547" y="417.5929291125633" width="184" height="66" rx="12" fill="#fff4c2" stroke="#d4ccb8" stroke-width="1.2"/><text x="565.2619766708755" y="445.8304291125633" font-size="12.5" font-weight="700" fill="#1c2541" text-anchor="middle">4 IA &amp; Interaction</text><text x="565.2619766708755" y="465.4554291125633" font-size="10.5" font-weight="500" fill="#4a4f57" text-anchor="middle">Sitemap · User flow · HTA</text><rect x="288.0" y="475.0" width="184" height="66" rx="12" fill="#e5f2ea" stroke="#d4ccb8" stroke-width="1.2"/>