<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>From assumption to design decision</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="700" height="300" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">From assumption to design decision</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Turn a risky assumption into research – and let the findings decide the design</text><rect x="28" y="84" width="204" height="86" rx="14" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><circle cx="50" cy="106" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="50" y="111" font-size="11.5" font-weight="800" fill="#ff8a3d" text-anchor="middle">1</text><text x="72" y="111" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">Assumption</text><text x="42" y="140.0" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">New users don't understand</text><text x="42" y="155.18" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">the rules</text><line x1="233" y1="127" x2="247" y2="127" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="248" y="84" width="204" height="86" rx="14" fill="#f2994a" stroke="#f2994a" stroke-width="1.2"/><circle cx="270" cy="106" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="270" y="111" font-size="11.5" font-weight="800" fill="#f2994a" text-anchor="middle">2</text><text x="292" y="111" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">Research question</text><text x="262" y="140.0" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">What challenges do new</text><text x="262" y="155.18" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">users face?</text><line x1="453" y1="127" x2="467" y2="127" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="468" y="84" width="204" height="86" rx="14" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><circle cx="490" cy="106" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="490" y="111" font-size="11.5" font-weight="800" fill="#f2c94c" text-anchor="middle">3</text><text x="512" y="111" font-size="13" font-weight="800" fill="#1c2541" text-anchor="start">Interview question</text><text x="482" y="140.0" font-size="11.5" font-weight="600" fill="#1c2541" text-anchor="start">Describe the first time you</text><text x="482" y="155.18" font-size="11.5" font-weight="600" fill="#1c2541" text-anchor="start">played</text><rect x="468" y="188" width="204" height="86" rx="14" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><circle cx="490" cy="210" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="490" y="215" font-size="11.5" font-weight="800" fill="#12b886" text-anchor="middle">4</text><text x="512" y="215" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">Usability task</text><text x="482" y="244.0" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">Arrange these cards into</text><text x="482" y="259.18" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">valid sets</text><line x1="467" y1="231" x2="453" y2="231" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="248" y="188" width="204" height="86" rx="14" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><circle cx="270" cy="210" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="270" y="215" font-size="11.5" font-weight="800" fill="#2f80ed" text-anchor="middle">5</text><text x="292" y="215" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">Observation</text><text x="262" y="244.0" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">Where do they hesitate or</text><text x="262" y="259.18" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">ask for help?</text><line x1="247" y1="231" x2="233" y2="231" stroke="#7a7f87" stroke-width="1.6" marker-end="url(#a7a7f87)"/><rect x="28" y="188" width="204" height="86" rx="14" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><circle cx="50" cy="210" r="13" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="50" y="215" font-size="11.5" font-weight="800" fill="#7b5cff" text-anchor="middle">6</text><text x="72" y="215" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">Design decision</text><text x="42" y="244.0" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">Full tutorial, hints, or</text><text x="42" y="259.18" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">simpler play?</text><path d="M 672 128 C 694 150, 694 168, 672 190" stroke="#7a7f87" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>