<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 516" width="700" height="516" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>How the four roles work together</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="700" height="516" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">How the four roles work together</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">A conceptual workflow – in real teams these roles overlap and collaborate continuously</text><circle cx="52" cy="110" r="22" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><text x="52" y="116" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><line x1="52" y1="134" x2="52" y2="152" stroke="#d4ccb8" stroke-width="3"/><rect x="88" y="84" width="584" height="54" rx="12" fill="#ffffff" stroke="#ff8a3d" stroke-width="2"/><rect x="88" y="84" width="10" height="54" rx="4" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><text x="112" y="107" font-size="14" font-weight="800" fill="#1f2328" text-anchor="start">Product Manager</text><text x="112" y="127" font-size="11.5" font-weight="600" fill="#4a4f57" text-anchor="start">Identifies the business problem, sets priorities</text><text x="660" y="116" font-size="11" font-weight="700" fill="#7a7f87" text-anchor="end">Vision, roadmap, requirements</text><circle cx="52" cy="176" r="22" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><text x="52" y="182" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><line x1="52" y1="200" x2="52" y2="218" stroke="#d4ccb8" stroke-width="3"/><rect x="88" y="150" width="584" height="54" rx="12" fill="#ffffff" stroke="#7b5cff" stroke-width="2"/><rect x="88" y="150" width="10" height="54" rx="4" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><text x="112" y="173" font-size="14" font-weight="800" fill="#1f2328" text-anchor="start">Product Designer</text><text x="112" y="193" font-size="11.5" font-weight="600" fill="#4a4f57" text-anchor="start">Shapes the overall product experience</text><text x="660" y="182" font-size="11" font-weight="700" fill="#7a7f87" text-anchor="end">Design strategy, concepts, prototypes</text><circle cx="52" cy="242" r="22" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><text x="52" y="248" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><line x1="52" y1="266" x2="52" y2="284" stroke="#d4ccb8" stroke-width="3"/><rect x="88" y="216" width="584" height="54" rx="12" fill="#ffffff" stroke="#12b886" stroke-width="2"/><rect x="88" y="216" width="10" height="54" rx="4" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><text x="112" y="239" font-size="14" font-weight="800" fill="#1f2328" text-anchor="start">UX Designer</text><text x="112" y="259" font-size="11.5" font-weight="600" fill="#4a4f57" text-anchor="start">Structure, user journey and interaction flow</text><text x="660" y="248" font-size="11" font-weight="700" fill="#7a7f87" text-anchor="end">Research, journeys, IA, wireframes</text><circle cx="52" cy="308" r="22" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><text x="52" y="314" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><line x1="52" y1="332" x2="52" y2="350" stroke="#d4ccb8" stroke-width="3"/><rect x="88" y="282" width="584" height="54" rx="12" fill="#ffffff" stroke="#2f80ed" stroke-width="2"/><rect x="88" y="282" width="10" height="54" rx="4" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><text x="112" y="305" font-size="14" font-weight="800" fill="#1f2328" text-anchor="start">UI Designer</text><text x="112" y="325" font-size="11.5" font-weight="600" fill="#4a4f57" text-anchor="start">Visual interface and reusable components</text><text x="660" y="314" font-size="11" font-weight="700" fill="#7a7f87" text-anchor="end">Hi-fi screens, UI specs</text><circle cx="52" cy="374" r="22" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><text x="52" y="380" font-size="16" font-weight="800" fill="#1c2541" text-anchor="middle">5</text><line x1="52" y1="398" x2="52" y2="416" stroke="#d4ccb8" stroke-width="3"/><rect x="88" y="348" width="584" height="54" rx="12" fill="#ffffff" stroke="#f2c94c" stroke-width="2"/><rect x="88" y="348" width="10" height="54" rx="4" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><text x="112" y="371" font-size="14" font-weight="800" fill="#1f2328" text-anchor="start">Engineering Team</text><text x="112" y="391" font-size="11.5" font-weight="600" fill="#4a4f57" text-anchor="start">Builds the product with the team throughout</text><text x="660" y="380" font-size="11" font-weight="700" fill="#7a7f87" text-anchor="end">Functional product</text><circle cx="52" cy="440" r="22" fill="#eb5757" stroke="#eb5757" stroke-width="1.2"/><text x="52" y="446" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><rect x="88" y="414" width="584" height="54" rx="12" fill="#ffffff" stroke="#eb5757" stroke-width="2"/><rect x="88" y="414" width="10" height="54" rx="4" fill="#eb5757" stroke="#eb5757" stroke-width="1.2"/><text x="112" y="437" font-size="14" font-weight="800" fill="#1f2328" text-anchor="start">Product Team</text><text x="112" y="457" font-size="11.5" font-weight="600" fill="#4a4f57" text-anchor="start">Measures results, learns, improves</text><text x="660" y="446" font-size="11" font-weight="700" fill="#7a7f87" text-anchor="end">Insights for the next cycle</text><path d="M 30 440 C 0 414, 0 110, 30 110" stroke="#eb5757" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/></svg>