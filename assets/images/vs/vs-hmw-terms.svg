<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 416" width="700" height="416" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Five words, five purposes</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="700" height="416" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Five words, five purposes</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Assumption → Question → Hypothesis → Problem Statement → HMW</text><rect x="28" y="80" width="200" height="52" rx="12" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><text x="128" y="104" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Assumption</text><text x="128" y="122" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">What we believe – not yet proven</text><rect x="240" y="80" width="432" height="52" rx="12" fill="#ffffff" stroke="#ff8a3d" stroke-width="2"/><text x="256" y="111" font-size="12" font-weight="600" fill="#4a4f57" text-anchor="start">Users abandon checkout because of too many steps.</text><rect x="28" y="144" width="200" height="52" rx="12" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><text x="128" y="168" font-size="14" font-weight="800" fill="#1c2541" text-anchor="middle">Question</text><text x="128" y="186" font-size="10" font-weight="600" fill="#1c2541" text-anchor="middle">What we want to find out</text><rect x="240" y="144" width="432" height="52" rx="12" fill="#ffffff" stroke="#f2c94c" stroke-width="2"/><text x="256" y="175" font-size="12" font-weight="600" fill="#4a4f57" text-anchor="start">Why are users abandoning checkout?</text><rect x="28" y="208" width="200" height="52" rx="12" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><text x="128" y="232" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Hypothesis</text><text x="128" y="250" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">A testable prediction</text><rect x="240" y="208" width="432" height="52" rx="12" fill="#ffffff" stroke="#12b886" stroke-width="2"/><text x="256" y="239" font-size="12" font-weight="600" fill="#4a4f57" text-anchor="start">If we reduce steps, more users may complete orders.</text><rect x="28" y="272" width="200" height="52" rx="12" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><text x="128" y="296" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Problem Statement</text><text x="128" y="314" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">The problem to solve</text><rect x="240" y="272" width="432" height="52" rx="12" fill="#ffffff" stroke="#2f80ed" stroke-width="2"/><text x="256" y="303" font-size="12" font-weight="600" fill="#4a4f57" text-anchor="start">Checkout is confusing and the final price is unclear.</text><rect x="28" y="336" width="200" height="52" rx="12" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><text x="128" y="360" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">How Might We</text><text x="128" y="378" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">A question that opens up solutions</text><rect x="240" y="336" width="432" height="52" rx="12" fill="#ffffff" stroke="#7b5cff" stroke-width="2"/><text x="256" y="367" font-size="12" font-weight="600" fill="#4a4f57" text-anchor="start">HMW make checkout simpler and more transparent?</text></svg>