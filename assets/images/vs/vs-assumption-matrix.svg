<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Assumption risk matrix</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="640" height="420" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Assumption risk matrix</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Importance vs evidence – illustrative examples for Classic Rummy</text><rect x="110" y="84" width="250" height="144" rx="14" fill="#eb5757" stroke="#eb5757" stroke-width="1.2"/><text x="126" y="112" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start">Validate immediately</text><text x="126" y="132" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">High importance · Low evidence</text><text x="126" y="164.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">New users don't understand Rummy</text><text x="126" y="179.84" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">rules.</text><rect x="370" y="84" width="250" height="144" rx="14" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><text x="386" y="112" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start">Monitor and act</text><text x="386" y="132" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">High importance · High evidence</text><text x="386" y="164.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">First-game abandonment is a</text><text x="386" y="179.84" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">major issue.</text><rect x="110" y="238" width="250" height="144" rx="14" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><text x="126" y="266" font-size="15" font-weight="800" fill="#1c2541" text-anchor="start">Validate later</text><text x="126" y="286" font-size="10.5" font-weight="700" fill="#1c2541" text-anchor="start">Low importance · Low evidence</text><text x="126" y="318.0" font-size="12" font-weight="600" fill="#1c2541" text-anchor="start">Users may prefer a particular</text><text x="126" y="333.84" font-size="12" font-weight="600" fill="#1c2541" text-anchor="start">tutorial animation.</text><rect x="370" y="238" width="250" height="144" rx="14" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><text x="386" y="266" font-size="15" font-weight="800" fill="#ffffff" text-anchor="start">No immediate action</text><text x="386" y="286" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Low importance · High evidence</text><text x="386" y="318.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">Users understand the login</text><text x="386" y="333.84" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start">screen.</text><text x="84" y="160" font-size="11" font-weight="800" fill="#4a4f57" text-anchor="end">High</text><text x="84" y="314" font-size="11" font-weight="800" fill="#4a4f57" text-anchor="end">Low</text><text x="56" y="237" font-size="11" font-weight="800" fill="#7a7f87" text-anchor="middle">Importance</text><text x="235" y="404" font-size="11" font-weight="800" fill="#4a4f57" text-anchor="middle">Low evidence</text><text x="495" y="404" font-size="11" font-weight="800" fill="#4a4f57" text-anchor="middle">High evidence</text><rect x="110" y="84" width="250" height="144" rx="14" fill="none" stroke="#1c2541" stroke-width="3"/></svg>