<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Review the PRD before opening Figma</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="700" height="300" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Review the PRD before opening Figma</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Eight areas a Senior Product Designer checks in a PM's PRD draft</text><rect x="28" y="82" width="152" height="90" rx="14" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><circle cx="52" cy="108" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="52" y="113" font-size="12" font-weight="800" fill="#ff8a3d" text-anchor="middle">1</text><text x="74" y="113" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start">Problem</text><text x="42" y="144.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">Is the real problem</text><text x="42" y="159.18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">clear?</text><rect x="192" y="82" width="152" height="90" rx="14" fill="#f2994a" stroke="#f2994a" stroke-width="1.2"/><circle cx="216" cy="108" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="216" y="113" font-size="12" font-weight="800" fill="#f2994a" text-anchor="middle">2</text><text x="238" y="113" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start">Research</text><text x="206" y="144.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">Is there evidence</text><text x="206" y="159.18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">for it?</text><rect x="356" y="82" width="152" height="90" rx="14" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><circle cx="380" cy="108" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="380" y="113" font-size="12" font-weight="800" fill="#f2c94c" text-anchor="middle">3</text><text x="402" y="113" font-size="14" font-weight="800" fill="#1c2541" text-anchor="start">Users</text><text x="370" y="144.0" font-size="11.5" font-weight="700" fill="#1c2541" text-anchor="start">Are target users</text><text x="370" y="159.18" font-size="11.5" font-weight="700" fill="#1c2541" text-anchor="start">well defined?</text><rect x="520" y="82" width="152" height="90" rx="14" fill="#6fcf97" stroke="#6fcf97" stroke-width="1.2"/><circle cx="544" cy="108" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="544" y="113" font-size="12" font-weight="800" fill="#6fcf97" text-anchor="middle">4</text><text x="566" y="113" font-size="14" font-weight="800" fill="#1c2541" text-anchor="start">Requirements</text><text x="534" y="144.0" font-size="11.5" font-weight="700" fill="#1c2541" text-anchor="start">Is every</text><text x="534" y="159.18" font-size="11.5" font-weight="700" fill="#1c2541" text-anchor="start">requirement clear?</text><rect x="28" y="186" width="152" height="90" rx="14" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><circle cx="52" cy="212" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="52" y="217" font-size="12" font-weight="800" fill="#12b886" text-anchor="middle">5</text><text x="74" y="217" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start">UX</text><text x="42" y="248.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">Journey &amp; flow</text><text x="42" y="263.18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">needs covered?</text><rect x="192" y="186" width="152" height="90" rx="14" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><circle cx="216" cy="212" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="216" y="217" font-size="12" font-weight="800" fill="#2f80ed" text-anchor="middle">6</text><text x="238" y="217" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start">Edge cases</text><text x="206" y="248.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">Skip, exit,</text><text x="206" y="263.18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">return…?</text><rect x="356" y="186" width="152" height="90" rx="14" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><circle cx="380" cy="212" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="380" y="217" font-size="12" font-weight="800" fill="#7b5cff" text-anchor="middle">7</text><text x="402" y="217" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start">Metrics</text><text x="370" y="248.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">How is success</text><text x="370" y="263.18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">measured?</text><rect x="520" y="186" width="152" height="90" rx="14" fill="#eb5757" stroke="#eb5757" stroke-width="1.2"/><circle cx="544" cy="212" r="14" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/><text x="544" y="217" font-size="12" font-weight="800" fill="#eb5757" text-anchor="middle">8</text><text x="566" y="217" font-size="14" font-weight="800" fill="#ffffff" text-anchor="start">Scope</text><text x="534" y="248.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">What is in – and</text><text x="534" y="263.18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start">out?</text></svg>