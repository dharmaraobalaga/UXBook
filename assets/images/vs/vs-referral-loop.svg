<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Food delivery referral loop</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="640" height="400" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Food delivery referral loop</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">The result of one cycle starts the next – existing users bring new users</text><circle cx="320" cy="236" r="120" fill="none" stroke="#d4ccb8" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="320" cy="236" r="52" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="320" y="234" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Loop</text><text x="320" y="252" font-size="11" font-weight="600" fill="#c9d0ea" text-anchor="middle">repeats</text><rect x="256.0" y="96.0" width="128" height="40" rx="20" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><text x="274.0" y="121.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="326.0" y="121.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Existing user</text><rect x="359.92304845413264" y="156.0" width="128" height="40" rx="20" fill="#f2c94c" stroke="#f2c94c" stroke-width="1.2"/><text x="377.92304845413264" y="181.0" font-size="13" font-weight="800" fill="#1c2541" text-anchor="middle">2</text><text x="429.92304845413264" y="181.0" font-size="12" font-weight="800" fill="#1c2541" text-anchor="middle">Referral link</text><rect x="359.92304845413264" y="276.0" width="128" height="40" rx="20" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><text x="377.92304845413264" y="301.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="429.92304845413264" y="301.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">New user</text><rect x="256.0" y="336.0" width="128" height="40" rx="20" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><text x="274.0" y="361.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="326.0" y="361.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">First order</text><rect x="152.0769515458674" y="276.00000000000006" width="128" height="40" rx="20" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><text x="170.0769515458674" y="301.00000000000006" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="222.0769515458674" y="301.00000000000006" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Reward</text><rect x="152.07695154586736" y="156.0" width="128" height="40" rx="20" fill="#eb5757" stroke="#eb5757" stroke-width="1.2"/><text x="170.07695154586736" y="181.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="222.07695154586736" y="181.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">More referrals</text></svg>