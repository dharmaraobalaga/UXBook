<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" width="760" height="616" font-family="Inter, 'Noto Sans Telugu', 'Nirmala UI', 'Telugu MN', Gautami, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Example: a new user’s experience in the Classic Rummy app</title><defs><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker></defs><rect x="0" y="0" width="760" height="616" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">Example: a new user’s experience in the Classic Rummy app</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">User Journey · 5 stages</text><line x1="52" y1="96" x2="52" y2="576" stroke="#d4ccb8" stroke-width="2"/><circle cx="52" cy="102" r="14" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="52" y="107" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="80" y="107" font-size="15" font-weight="700" fill="#1c2541" text-anchor="start">Awareness</text><text x="80" y="130" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">The user learns about the Classic Rummy app through an advertisement.</text><rect x="80" y="142" width="76" height="22" rx="11" fill="#e5f2ea" stroke="#2f7a55" stroke-width="1.2"/><text x="118.0" y="157" font-size="11.5" font-weight="700" fill="#2f7a55" text-anchor="middle">Positive</text><text x="170" y="158" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="start" font-style="italic">“This app looks good, I should try it once.”</text><circle cx="52" cy="206" r="14" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="52" y="211" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="80" y="211" font-size="15" font-weight="700" fill="#1c2541" text-anchor="start">Consideration</text><text x="80" y="234" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">Thinks about whether to download it; checks ratings and features.</text><rect x="80" y="246" width="83" height="22" rx="11" fill="#f8e9e1" stroke="#9a4b2b" stroke-width="1.2"/><text x="121.5" y="261" font-size="11.5" font-weight="700" fill="#9a4b2b" text-anchor="middle">Uncertain</text><text x="177" y="262" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="start" font-style="italic">“Is this a trustworthy app?”</text><circle cx="52" cy="310" r="14" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="52" y="315" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="80" y="315" font-size="15" font-weight="700" fill="#1c2541" text-anchor="start">Registration</text><text x="80" y="338" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">Opens the app and registers with mobile number and OTP.</text><rect x="80" y="350" width="139" height="22" rx="11" fill="#f8e9e1" stroke="#9a4b2b" stroke-width="1.2"/><text x="149.5" y="365" font-size="11.5" font-weight="700" fill="#9a4b2b" text-anchor="middle">Possible Friction</text><text x="233" y="366" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="start" font-style="italic">“Is registration easy?”</text><circle cx="52" cy="414" r="14" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="52" y="419" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="80" y="419" font-size="15" font-weight="700" fill="#1c2541" text-anchor="start">First Game</text><text x="80" y="442" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">Learns how to play and plays the first game.</text><rect x="80" y="454" width="69" height="22" rx="11" fill="#e5f2ea" stroke="#2f7a55" stroke-width="1.2"/><text x="114.5" y="469" font-size="11.5" font-weight="700" fill="#2f7a55" text-anchor="middle">Engaged</text><text x="163" y="470" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="start" font-style="italic">“Playing the game is interesting.”</text><circle cx="52" cy="518" r="14" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="52" y="523" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="80" y="523" font-size="15" font-weight="700" fill="#1c2541" text-anchor="start">Retention</text><text x="80" y="546" font-size="12.5" font-weight="500" fill="#1f2328" text-anchor="start">With a good experience, the user opens the app again and plays.</text><rect x="80" y="558" width="83" height="22" rx="11" fill="#e5f2ea" stroke="#2f7a55" stroke-width="1.2"/><text x="121.5" y="573" font-size="11.5" font-weight="700" fill="#2f7a55" text-anchor="middle">Satisfied</text><text x="177" y="574" font-size="12" font-weight="500" fill="#4a4f57" text-anchor="start" font-style="italic">“I should use this app again.”</text></svg>