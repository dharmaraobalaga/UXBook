<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>One problem – four HMW questions</title><defs><marker id="a1c2541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2541"/></marker><marker id="a1f6f78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f78"/></marker><marker id="a3d4b8f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4b8f"/></marker><marker id="a2f7a55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a55"/></marker><marker id="a4a4f57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/></marker><marker id="aa3365f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3365f"/></marker><marker id="ae8c547" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/></marker><marker id="a9a4b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4b2b"/></marker><marker id="a7a7f87" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7f87"/></marker></defs><rect x="0" y="0" width="700" height="400" rx="16" fill="#faf6ec"/><text x="28" y="38" font-size="19" font-weight="700" fill="#1c2541" text-anchor="start">One problem – four HMW questions</text><text x="28" y="60" font-size="12.5" font-weight="500" fill="#7a7f87" text-anchor="start">Each role looks at the same problem through a different lens</text><rect x="160" y="78" width="380" height="56" rx="14" fill="#1c2541" stroke="#1c2541" stroke-width="1.2"/><text x="350" y="102" font-size="11" font-weight="700" fill="#c9d0ea" text-anchor="middle">Common problem</text><text x="350" y="122" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">Customers abandon food orders at checkout</text><line x1="350" y1="134" x2="350" y2="148" stroke="#7a7f87" stroke-width="2"/><line x1="185" y1="148" x2="515" y2="148" stroke="#7a7f87" stroke-width="2"/><line x1="185" y1="148" x2="185" y2="158" stroke="#7a7f87" stroke-width="2"/><line x1="515" y1="148" x2="515" y2="158" stroke="#7a7f87" stroke-width="2"/><rect x="28" y="160" width="314" height="102" rx="14" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.2"/><text x="46" y="186" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">PM · Business</text><text x="46" y="212.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">How might we increase checkout</text><text x="46" y="228.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">conversion and completed orders?</text><rect x="358" y="160" width="314" height="102" rx="14" fill="#7b5cff" stroke="#7b5cff" stroke-width="1.2"/><text x="376" y="186" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">PD · Product experience</text><text x="376" y="212.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">How might we create a seamless and</text><text x="376" y="228.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">trustworthy checkout experience?</text><rect x="28" y="276" width="314" height="102" rx="14" fill="#12b886" stroke="#12b886" stroke-width="1.2"/><text x="46" y="302" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">UX · Usability</text><text x="46" y="328.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">How might we help users complete</text><text x="46" y="344.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">checkout with fewer steps and less</text><text x="46" y="361.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">confusion?</text><rect x="358" y="276" width="314" height="102" rx="14" fill="#2f80ed" stroke="#2f80ed" stroke-width="1.2"/><text x="376" y="302" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start">UI · Visual</text><text x="376" y="328.0" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">How might we make pricing, payment</text><text x="376" y="344.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">options and Place Order more visible?</text></svg>